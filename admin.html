<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>admin — ericjoo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e111a;color:rgba(230,232,240,.8);font-family:"DM Mono",monospace;min-height:100vh;display:flex;flex-direction:column}
#login{flex:1;display:flex;align-items:center;justify-content:center}
.box{border:1px solid rgba(230,232,240,.12);border-radius:12px;padding:40px;width:320px;background:rgba(14,17,26,.9);backdrop-filter:blur(10px)}
.box h1{font-size:9px;letter-spacing:.15em;color:rgba(230,232,240,.35);margin-bottom:24px;text-transform:uppercase}
.field-label{font-size:9px;letter-spacing:.1em;color:rgba(230,232,240,.3);text-transform:uppercase;margin-bottom:5px}
.box input{width:100%;background:rgba(230,232,240,.05);border:1px solid rgba(230,232,240,.12);border-radius:6px;color:rgba(230,232,240,.8);font-family:inherit;font-size:11px;padding:10px 12px;margin-bottom:14px;outline:none;transition:border-color 150ms}
.box input:focus{border-color:rgba(230,232,240,.3)}
.box button{width:100%;background:rgba(230,232,240,.07);border:1px solid rgba(230,232,240,.14);border-radius:6px;color:rgba(230,232,240,.7);font-family:inherit;font-size:9px;letter-spacing:.1em;padding:10px;cursor:pointer;transition:background 150ms,color 150ms}
.box button:hover{background:rgba(230,232,240,.12);color:rgba(230,232,240,.95)}
.err{font-size:8px;color:rgba(255,80,80,.8);margin-bottom:10px;min-height:14px}
#panel{display:none;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(14,17,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(230,232,240,.07);z-index:10}
.topbar h1{font-size:9px;letter-spacing:.15em;color:rgba(230,232,240,.35);text-transform:uppercase}
.topbar .acts{display:flex;gap:12px;align-items:center;font-size:8px}
.count{color:rgba(230,232,240,.22)}
.btn{background:none;border:1px solid rgba(230,232,240,.12);border-radius:4px;color:rgba(230,232,240,.45);font-family:inherit;font-size:8px;padding:4px 10px;cursor:pointer;transition:color 100ms,border-color 100ms}
.btn:hover{color:rgba(230,232,240,.9);border-color:rgba(230,232,240,.3)}
.btn.danger{border-color:rgba(255,60,60,.25);color:rgba(255,80,80,.5)}
.btn.danger:hover{border-color:rgba(255,60,60,.55);color:rgba(255,80,80,.9)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:32px}
.card{position:relative;border-radius:8px;overflow:hidden;border:1px solid rgba(230,232,240,.07);background:rgba(230,232,240,.02);transition:border-color 120ms}
.card:hover{border-color:rgba(230,232,240,.18)}
.card img{width:100%;display:block}
.card-foot{padding:8px 10px;font-size:7px;color:rgba(230,232,240,.28);display:flex;justify-content:space-between;align-items:center}
.delbtn{background:rgba(255,60,60,.07);border:1px solid rgba(255,60,60,.2);border-radius:3px;color:rgba(255,80,80,.55);font-family:inherit;font-size:7px;padding:2px 7px;cursor:pointer;transition:background 100ms,color 100ms}
.delbtn:hover{background:rgba(255,60,60,.16);color:rgba(255,80,80,.95)}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:rgba(230,232,240,.12);font-size:9px;letter-spacing:.08em}
.loading{grid-column:1/-1;text-align:center;padding:40px 0;color:rgba(230,232,240,.18);font-size:8px;animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Gallery Admin</h1>
    <div class="field-label">Email</div>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="username"/>
    <div class="field-label">Password</div>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    <div class="err" id="err"></div>
    <button id="loginBtn">sign in</button>
  </div>
</div>

<div id="panel">
  <div class="topbar">
    <h1>Gallery Admin</h1>
    <div class="acts">
      <span class="count" id="cnt"></span>
      <button class="btn danger" id="clearAll">clear all</button>
      <button class="btn" id="logoutBtn">logout</button>
    </div>
  </div>
  <div class="grid" id="grid"><div class="loading">loading...</div></div>
</div>

<script>
  firebase.initializeApp({
    apiKey:"AIzaSyARUJKhPxjNF6L3aLHkM0XCZ7DCX53OPtU",
    authDomain:"ericjoo2026.firebaseapp.com",
    projectId:"ericjoo2026",
    storageBucket:"ericjoo2026.firebasestorage.app",
    messagingSenderId:"1060832898340",
    appId:"1:1060832898340:web:7151912d0b2752da9c57b1"
  });
  const auth=firebase.auth();
  const db=firebase.firestore();

  const $=id=>document.getElementById(id);

  function showPanel(){
    $('login').style.display='none';
    $('panel').style.display='flex';
    load();
  }
  function showLogin(){
    $('panel').style.display='none';
    $('login').style.display='flex';
    $('err').textContent='';
  }

  // Check auth state on load — skip login if already signed in
  auth.onAuthStateChanged(user=>{
    if(user){showPanel();}else{showLogin();}
  });

  $('loginBtn').addEventListener('click',async()=>{
    $('err').textContent='';
    $('loginBtn').textContent='signing in...';
    $('loginBtn').disabled=true;
    try{
      await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);
    }catch(e){
      $('err').textContent=e.message||'Login failed.';
      $('loginBtn').textContent='sign in';
      $('loginBtn').disabled=false;
    }
  });

  $('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});

  $('logoutBtn').addEventListener('click',async()=>{
    await auth.signOut();
    showLogin();
  });

  $('clearAll').addEventListener('click',async()=>{
    if(!confirm('Delete all drawings? This cannot be undone.'))return;
    $('clearAll').textContent='deleting...';
    $('clearAll').disabled=true;
    try{
      const snap=await db.collection('gallery').get();
      const batch=db.batch();
      snap.docs.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      await load();
    }catch(e){console.error(e);}
    $('clearAll').textContent='clear all';
    $('clearAll').disabled=false;
  });

  async function load(){
    $('grid').innerHTML='<div class="loading">loading...</div>';
    try{
      const snap=await db.collection('gallery').orderBy('ts','desc').get();
      const items=snap.docs.map(d=>({id:d.id,...d.data()}));
      $('cnt').textContent=`${items.length} drawing${items.length!==1?'s':''}`;
      $('grid').innerHTML='';
      if(!items.length){$('grid').innerHTML='<div class="empty">no drawings yet</div>';return;}
      for(const item of items){
        const card=document.createElement('div');card.className='card';
        const img=document.createElement('img');img.src=item.dataUrl||'';img.alt='drawing';
        const foot=document.createElement('div');foot.className='card-foot';
        const ts=document.createElement('span');
        ts.textContent=new Date(item.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
        const del=document.createElement('button');del.className='delbtn';del.textContent='× delete';
        del.addEventListener('click',async()=>{
          del.textContent='...';del.disabled=true;
          try{
            await db.collection('gallery').doc(item.id).delete();
            card.remove();
            const rem=$('grid').querySelectorAll('.card').length;
            $('cnt').textContent=`${rem} drawing${rem!==1?'s':''}`;
            if(!rem)$('grid').innerHTML='<div class="empty">no drawings yet</div>';
          }catch(e){console.error(e);del.textContent='× delete';del.disabled=false;}
        });
        foot.appendChild(ts);foot.appendChild(del);
        card.appendChild(img);card.appendChild(foot);
        $('grid').appendChild(card);
      }
    }catch(e){
      console.error('load gallery',e);
      $('grid').innerHTML='<div class="empty">error loading gallery</div>';
    }
  }
</script>
</body>
</html>
